    - cron: '*/5 * * * *'  # প্রতি ৫ মিনিটে অটো রান
  workflow_dispatch:        # ম্যানুয়াল রানের জন্য

jobs:
  run-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Traffic Engine
        run: |
          curl -X GET "https://globalseotop1.netlify.app/.netlify/functions/traffic-cron?secret=GSEO247&threads=8&cycles=5"
